<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>بوابة الدفع - لوحة التحكم</title>
<style>
:root{--bg:#f6f4ef;--ink:#1d2327;--mut:#6b7378;--line:#d9d5ca;--teal:#0d5c63;--amber:#c47f17;--red:#a8323e;--card:#fffdf8;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#14181a;--ink:#ece9e1;--mut:#9aa3a7;--line:#2c3336;--teal:#4fb3bb;--amber:#e3a63f;--red:#e0707b;--card:#1b2124;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Segoe UI",Tahoma,"Noto Naskh Arabic",sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:1.4rem;margin:0}
.net{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:999px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--teal)}.off .dot{background:var(--amber)}
button{font:inherit;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:6px}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}button:focus-visible,input:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.grid{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:20px}@media(max-width:760px){.grid{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
label{display:block;font-size:.9rem;color:var(--mut);margin:12px 0 4px}
input{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);direction:ltr;text-align:left}
.row{display:flex;gap:10px}.row>div{flex:1}
#res{margin-top:14px;padding:10px 12px;border-radius:6px;display:none;border-inline-start:4px solid var(--teal);background:var(--bg)}
#res.bad{border-color:var(--red)}#res.wait{border-color:var(--amber)}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:right;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mut);font-weight:600}
.pan{direction:ltr;unicode-bidi:embed;font-variant-numeric:tabular-nums}
.s-approved{color:var(--teal)}.s-declined,.s-declined_after_offline{color:var(--red)}.s-pending_sync{color:var(--amber)}
.empty{color:var(--mut);padding:24px 0;text-align:center}
</style></head><body><main>
<header><h1>بوابة الدفع <span style="color:var(--mut);font-weight:400">(بيئة تجريبية)</span></h1>
<div class="net" id="net"><span class="dot"></span><span id="netTxt">متصل</span><button class="ghost" id="tog">قطع الاتصال</button></div></header>
<div class="grid">
<section class="panel"><form id="f" autocomplete="off">
<label for="pan">رقم الكارت</label><input id="pan" inputmode="numeric" placeholder="4242 4242 4242 4242" required>
<div class="row"><div><label for="exp">الانتهاء (MM/YY)</label><input id="exp" placeholder="12/30" required></div>
<div><label for="amt">المبلغ (جنيه)</label><input id="amt" inputmode="decimal" placeholder="150" required></div></div>
<label for="key">مفتاح API</label><input id="key" value="dev-key">
<p style="margin:16px 0 0"><button type="submit">تنفيذ الدفع</button></p></form><div id="res" role="status"></div></section>
<section class="panel"><div class="bar"><strong>العمليات</strong><span><span id="pend" style="color:var(--amber)"></span> <button class="ghost" id="sync">مزامنة المعلّقة</button></span></div>
<div class="tw"><table><thead><tr><th>الوقت</th><th>الكارت</th><th>المبلغ</th><th>النوع</th><th>الحالة</th><th>كود</th></tr></thead><tbody id="tb"></tbody></table></div></section>
</div></main>
<script>
const $=id=>document.getElementById(id),api=(p,m='GET',b)=>fetch('/api/'+p,{method:m,headers:{'x-api-key':$('key').value,'Content-Type':'application/json'},body:b&&JSON.stringify(b)}).then(r=>r.json());
const ST={approved:'موافق عليها',declined:'مرفوضة',pending_sync:'معلّقة للمزامنة',declined_after_offline:'مرفوضة بعد المزامنة'};
let online=true;
function td(t,c){const e=document.createElement('td');e.textContent=t;if(c)e.className=c;return e}
async function load(){const d=await api('transactions');if(d.error)return;online=d.online;
 $('net').className='net'+(online?'':' off');$('netTxt').textContent=online?'متصل بالبنك':'أوفلاين';$('tog').textContent=online?'قطع الاتصال':'إعادة الاتصال';
 $('pend').textContent=d.pending?d.pending+' معلّقة':'';const tb=$('tb');tb.textContent='';
 if(!d.txs.length){const r=tb.insertRow(),c=r.insertCell();c.colSpan=6;c.className='empty';c.textContent='لا توجد عمليات بعد. نفّذ أول دفعة من النموذج.';return}
 d.txs.forEach(t=>{const r=tb.insertRow();r.append(td(new Date(t.createdAt).toLocaleTimeString('ar-EG')),td(t.first6+'••••••'+t.last4,'pan'),td(t.amount.toFixed(2)),td(t.mode==='online'?'أونلاين':'أوفلاين'),td(ST[t.status]||t.status,'s-'+t.status),td(t.responseCode))})}
$('f').onsubmit=async e=>{e.preventDefault();const r=await api('pay','POST',{pan:$('pan').value,expiry:$('exp').value,amount:$('amt').value}),b=$('res');
 b.style.display='block';b.className=r.tx?(r.tx.status==='pending_sync'?'wait':r.ok?'':'bad'):'bad';b.textContent=r.error||r.tx.message+(r.tx.authCode?' (رقم التفويض '+r.tx.authCode+')':'');
 if(r.tx){$('pan').value='';$('exp').value='';$('amt').value=''}load()};
$('tog').onclick=async()=>{await api('network','POST',{online:!online});load()};
$('sync').onclick=async()=>{const r=await api('sync','POST');const b=$('res');b.style.display='block';b.className=r.failed?'wait':'';b.textContent=r.failed?'مفيش اتصال، لسه '+r.remaining+' معلّقة':'تمت مزامنة '+r.synced+' عملية';load()};
load();
</script></body></html>
